[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorskillgraph"
version = "0.1.0"
description = "A source-linked teaching decision prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pilot = ["numpy>=1.24"]
grounded = ["sympy==1.14.0"]

[tool.setuptools.packages.find]
where = ["src"]
